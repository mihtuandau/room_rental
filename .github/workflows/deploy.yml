name: Deploy

on:
  workflow_run:
    workflows: [CI]
    types: [completed]

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: false

env:
  RELEASE_SHA: ${{ github.event.workflow_run.head_sha }}

jobs:
  deploy-staging:
    name: Deploy staging
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: staging

    steps:
      - name: Deploy backend and frontend to staging
        shell: bash
        env:
          RELEASE_SHA: ${{ github.event.workflow_run.head_sha }}
          BACKEND_HOST: ${{ secrets.BACKEND_STAGING_VPS_HOST }}
          BACKEND_USER: ${{ secrets.BACKEND_STAGING_VPS_USER }}
          BACKEND_PATH: ${{ secrets.BACKEND_STAGING_DEPLOY_PATH }}
          BACKEND_KEY: ${{ secrets.BACKEND_STAGING_VPS_SSH_PRIVATE_KEY }}
          BACKEND_HOST_KEY: ${{ secrets.BACKEND_STAGING_VPS_HOST_KEY }}
          FRONTEND_HOST: ${{ secrets.FRONTEND_STAGING_VPS_HOST }}
          FRONTEND_USER: ${{ secrets.FRONTEND_STAGING_VPS_USER }}
          FRONTEND_PATH: ${{ secrets.FRONTEND_STAGING_DEPLOY_PATH }}
          FRONTEND_KEY: ${{ secrets.FRONTEND_STAGING_VPS_SSH_PRIVATE_KEY }}
          FRONTEND_HOST_KEY: ${{ secrets.FRONTEND_STAGING_VPS_HOST_KEY }}
        run: |
          set -euo pipefail
          test -n "$RELEASE_SHA"
          test -n "$BACKEND_HOST"
          test -n "$BACKEND_USER"
          test -n "$BACKEND_PATH"
          test -n "$BACKEND_KEY"
          test -n "$BACKEND_HOST_KEY"
          test -n "$FRONTEND_HOST"
          test -n "$FRONTEND_USER"
          test -n "$FRONTEND_PATH"
          test -n "$FRONTEND_KEY"
          test -n "$FRONTEND_HOST_KEY"

          mkdir -p "$HOME/.ssh"
          printf '%s\n' "$BACKEND_KEY" | tr -d '\r' > "$HOME/.ssh/roomrent_staging_backend"
          printf '%s\n' "$FRONTEND_KEY" | tr -d '\r' > "$HOME/.ssh/roomrent_staging_frontend"
          chmod 600 "$HOME/.ssh/roomrent_staging_backend" "$HOME/.ssh/roomrent_staging_frontend"
          {
            printf '%s %s\n' "$BACKEND_HOST" "$BACKEND_HOST_KEY"
            printf '%s %s\n' "$FRONTEND_HOST" "$FRONTEND_HOST_KEY"
          } > "$HOME/.ssh/known_hosts"
          chmod 644 "$HOME/.ssh/known_hosts"

          ssh -i "$HOME/.ssh/roomrent_staging_backend" \
            -o IdentitiesOnly=yes -o BatchMode=yes \
            -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            "$BACKEND_USER@$BACKEND_HOST" \
            "cd '$BACKEND_PATH' && git fetch --no-tags origin main && git checkout --detach '$RELEASE_SHA' && bash ops/deploy-backend.sh staging '$RELEASE_SHA'"

          ssh -i "$HOME/.ssh/roomrent_staging_frontend" \
            -o IdentitiesOnly=yes -o BatchMode=yes \
            -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            "$FRONTEND_USER@$FRONTEND_HOST" \
            "cd '$FRONTEND_PATH' && git fetch --no-tags origin main && git checkout --detach '$RELEASE_SHA' && bash ../ops/deploy-frontend.sh staging '$RELEASE_SHA'"

  smoke-staging:
    name: Smoke test staging
    needs: deploy-staging
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Run staging smoke test
        env:
          STAGING_FRONTEND_URL: ${{ vars.STAGING_FRONTEND_URL }}
          STAGING_API_URL: ${{ vars.STAGING_API_URL }}
        run: |
          set -euo pipefail
          test -n "$STAGING_FRONTEND_URL"
          test -n "$STAGING_API_URL"
          bash ops/smoke-test.sh "$STAGING_FRONTEND_URL" "$STAGING_API_URL" staging

  deploy-production:
    name: Deploy production
    needs: smoke-staging
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: production
      url: https://dautuan.com

    steps:
      - name: Deploy backend and frontend to production
        shell: bash
        env:
          RELEASE_SHA: ${{ github.event.workflow_run.head_sha }}
          BACKEND_HOST: ${{ secrets.BACKEND_VPS_HOST }}
          BACKEND_USER: ${{ secrets.BACKEND_VPS_USER }}
          BACKEND_PATH: ${{ secrets.BACKEND_DEPLOY_PATH }}
          BACKEND_KEY: ${{ secrets.BACKEND_VPS_SSH_PRIVATE_KEY }}
          BACKEND_HOST_KEY: ${{ secrets.BACKEND_VPS_HOST_KEY }}
          FRONTEND_HOST: ${{ secrets.FRONTEND_VPS_HOST }}
          FRONTEND_USER: ${{ secrets.FRONTEND_VPS_USER }}
          FRONTEND_PATH: ${{ secrets.FRONTEND_DEPLOY_PATH }}
          FRONTEND_KEY: ${{ secrets.FRONTEND_VPS_SSH_PRIVATE_KEY }}
          FRONTEND_HOST_KEY: ${{ secrets.FRONTEND_VPS_HOST_KEY }}
        run: |
          set -euo pipefail
          test -n "$RELEASE_SHA"
          test -n "$BACKEND_HOST"
          test -n "$BACKEND_USER"
          test -n "$BACKEND_PATH"
          test -n "$BACKEND_KEY"
          test -n "$BACKEND_HOST_KEY"
          test -n "$FRONTEND_HOST"
          test -n "$FRONTEND_USER"
          test -n "$FRONTEND_PATH"
          test -n "$FRONTEND_KEY"
          test -n "$FRONTEND_HOST_KEY"

          mkdir -p "$HOME/.ssh"
          printf '%s\n' "$BACKEND_KEY" | tr -d '\r' > "$HOME/.ssh/roomrent_production_backend"
          printf '%s\n' "$FRONTEND_KEY" | tr -d '\r' > "$HOME/.ssh/roomrent_production_frontend"
          chmod 600 "$HOME/.ssh/roomrent_production_backend" "$HOME/.ssh/roomrent_production_frontend"
          {
            printf '%s %s\n' "$BACKEND_HOST" "$BACKEND_HOST_KEY"
            printf '%s %s\n' "$FRONTEND_HOST" "$FRONTEND_HOST_KEY"
          } > "$HOME/.ssh/known_hosts"
          chmod 644 "$HOME/.ssh/known_hosts"

          ssh -i "$HOME/.ssh/roomrent_production_backend" \
            -o IdentitiesOnly=yes -o BatchMode=yes \
            -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            "$BACKEND_USER@$BACKEND_HOST" \
            "cd '$BACKEND_PATH' && git fetch --no-tags origin main && git checkout --detach '$RELEASE_SHA' && bash ops/deploy-backend.sh production '$RELEASE_SHA'"

          ssh -i "$HOME/.ssh/roomrent_production_frontend" \
            -o IdentitiesOnly=yes -o BatchMode=yes \
            -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            "$FRONTEND_USER@$FRONTEND_HOST" \
            "cd '$FRONTEND_PATH' && git fetch --no-tags origin main && git checkout --detach '$RELEASE_SHA' && bash ../ops/deploy-frontend.sh production '$RELEASE_SHA'"

      - name: Smoke test production
        env:
          PRODUCTION_FRONTEND_URL: ${{ vars.PRODUCTION_FRONTEND_URL }}
          PRODUCTION_API_URL: ${{ vars.PRODUCTION_API_URL }}
        run: |
          set -euo pipefail
          test -n "$PRODUCTION_FRONTEND_URL"
          test -n "$PRODUCTION_API_URL"
          curl --fail --silent --show-error --location --retry 3 "$PRODUCTION_FRONTEND_URL" >/dev/null
          curl --fail --silent --show-error --location --retry 3 "${PRODUCTION_API_URL%/}/health" >/dev/null
